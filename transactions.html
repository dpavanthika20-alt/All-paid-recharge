<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transactions — All Paid Recharge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="brand-mark">AP</span>All Paid Recharge</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="recharge.html">Recharge</a></li>
      <li><a href="plans.html">Plans</a></li>
      <li><a href="transactions.html" class="active">Transactions</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="help.html">Help</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" aria-label="Toggle dark mode">☾</button>
      <a href="#" class="btn btn-ghost" data-action="logout" style="color:var(--text-on-dark-muted)">Log out</a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

<div class="app-shell">
  <aside class="app-sidebar">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="recharge.html">📱 New recharge</a>
    <a href="plans.html">📶 Browse plans</a>
    <a href="transactions.html" class="active">🧾 Transactions</a>
    <a href="account.html">👤 Account</a>
    <a href="help.html">💬 Help</a>
  </aside>

  <main class="app-main">
    <h2>Recharge history</h2>
    <p class="mt-0">All your past recharges, simulated for this demo.</p>

    <div class="filter-bar card">
      <div class="field">
        <label for="search">Search</label>
        <input type="text" id="search" placeholder="Transaction ID or mobile number">
      </div>
      <div class="field">
        <label for="status-filter">Status</label>
        <select id="status-filter">
          <option value="">All statuses</option>
          <option>Successful</option>
          <option>Pending</option>
          <option>Failed</option>
        </select>
      </div>
      <div class="field">
        <label for="operator-filter">Operator</label>
        <select id="operator-filter">
          <option value="">All operators</option>
          <option value="jio">Jio</option>
          <option value="airtel">Airtel</option>
          <option value="bsnl">BSNL</option>
          <option value="vi">Vi</option>
        </select>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Transaction ID</th><th>Date</th><th>Mobile</th><th>Operator</th><th>Plan</th><th>Amount</th><th>Method</th><th>Status</th></tr>
        </thead>
        <tbody id="txn-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/script.js"></script>
<script>
APR.requireAuth();
const session = APR.getSession();
const badgeClass = { Successful: 'badge-success', Pending: 'badge-pending', Failed: 'badge-failed' };

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const status = document.getElementById('status-filter').value;
  const operator = document.getElementById('operator-filter').value;

  let list = APR.getTxns().filter(t => t.user === session.username);
  if(q) list = list.filter(t => t.id.toLowerCase().includes(q) || t.mobile.includes(q));
  if(status) list = list.filter(t => t.status === status);
  if(operator) list = list.filter(t => t.operator === operator);
  list.sort((a,b) => new Date(b.date) - new Date(a.date));

  const body = document.getElementById('txn-body');
  if(list.length === 0){
    body.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="icon">🔍</div>No transactions match your search.</div></td></tr>`;
    return;
  }
  body.innerHTML = list.map(t => `
    <tr>
      <td>${t.id}</td>
      <td>${new Date(t.date).toLocaleDateString()}</td>
      <td>${t.mobile}</td>
      <td style="text-transform:capitalize">${t.operator}</td>
      <td>${t.plan}</td>
      <td>₹${t.amount}</td>
      <td>${t.method}</td>
      <td><span class="badge ${badgeClass[t.status]}">${t.status}</span></td>
    </tr>
  `).join('');
}

['search','status-filter','operator-filter'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
</script>
</body>
</html>
